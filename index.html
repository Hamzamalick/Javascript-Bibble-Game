<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Bubble Game</title>
  </head>
  <body>
    <main>
      <div class="game">
        <div class="score-card">
          <div class="elem">
            <h2>Hit</h2>
            <div id="hit" class="box">0</div>
          </div>
          <div class="elem">
            <h2>Timer</h2>
            <div id="myTime" class="box">60</div>
          </div>
          <div class="elem">
            <h2>Score</h2>
            <div id="score" class="box">0</div>
          </div>
        </div>
        <div class="game-bottom"></div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
